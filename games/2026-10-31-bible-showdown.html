<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Showdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Figtree:wght@400;600;700&family=Literata:ital,opsz,wght@0,7..72,500;1,7..72,400;1,7..72,500&display=swap">
<style>
/* Layout: a projector-first game-show stage. Scoreboard band along the bottom, question center stage, host controls in one bar. */
:root{
  color-scheme: dark;
  --night:#0c1230;      /* stage background, lapis night */
  --panel:#151d45;      /* raised surfaces */
  --panel-2:#1d275a;
  --line:#2e3a78;
  --ink:#f5f0e2;        /* parchment white text */
  --muted:#a7afd6;
  --gold:#f4b942;       /* primary accent: lamp gold */
  --gold-ink:#241800;
  --ember:#ff6a3d;      /* streaks, low timer */
  --ok:#3fd18a;
  --bad:#ff5b6b;
  --f-display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-verse:"Literata",Georgia,"Times New Roman",serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(244,185,66,.13), transparent 60%),
    radial-gradient(900px 500px at 100% 110%, rgba(255,106,61,.08), transparent 60%),
    var(--night);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:clamp(15px, .55vw + 10px, 22px);
  line-height:1.45;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
#app{
  min-height:100%;
  padding-block:clamp(14px,2vw,28px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  max-width:1680px;margin:0 auto;
  display:flex;flex-direction:column;gap:clamp(14px,1.6vw,24px);
}
h1,h2,h3{font-family:var(--f-display);font-weight:900;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);font-size:.85em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Buttons */
.btn{
  border:2px solid var(--line);background:var(--panel-2);border-radius:999px;
  padding:.6em 1.15em;font-weight:700;display:inline-flex;align-items:center;gap:.5em;
  transition:transform .12s, background .12s, border-color .12s;
}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{font-size:1.15em;padding:.75em 1.5em}
.btn.ghost{background:transparent}
.btn.sm{font-size:.82em;padding:.4em .85em}
kbd{font-family:var(--f-body);font-size:.72em;border:1px solid currentColor;border-radius:5px;padding:0 .35em;opacity:.65}

/* ---------- Setup ---------- */
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(18px,3vw,48px);align-items:start}
.hero{display:flex;flex-direction:column;gap:1.1em;padding-top:1em}
.wordmark{font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:.82;font-size:clamp(64px,10vw,180px);letter-spacing:-.005em}
.wordmark span{display:block;color:var(--gold);-webkit-text-stroke:0}
.wordmark em{font-style:normal;display:block;color:transparent;-webkit-text-stroke:2px var(--ink)}
.hero p{max-width:34em;margin:0;font-size:1.05em}
.roundlist{list-style:none;margin:0;padding:0;display:grid;gap:.5em;counter-reset:r}
.roundlist li{display:grid;grid-template-columns:2.2em 1fr auto;gap:.8em;align-items:baseline;border-top:1px solid var(--line);padding-top:.5em}
.roundlist li::before{counter-increment:r;content:counter(r);font-family:var(--f-display);font-weight:900;font-size:1.6em;color:var(--gold);line-height:1}
.roundlist b{font-family:var(--f-display);font-size:1.25em;letter-spacing:.02em;text-transform:uppercase}
.roundlist small{display:block;color:var(--muted);font-size:.85em}
.roundlist .pts{font-family:var(--f-display);font-weight:800;color:var(--muted);white-space:nowrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,1.6vw,26px);display:flex;flex-direction:column;gap:1em;min-width:0}
.field{display:flex;flex-direction:column;gap:.45em}
.field>label,.label{font-weight:700;font-size:.85em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:.6em}
.stepper output{font-family:var(--f-display);font-weight:900;font-size:2em;min-width:1.6em;text-align:center}
.teaminputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.5em}
.teaminputs label{display:flex;align-items:center;gap:.5em;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:.15em .6em;min-width:0}
.teaminputs input{border:0;background:transparent;padding:.45em 0;width:100%;min-width:0;outline:none}
.teaminputs label:focus-within{border-color:var(--gold)}
.dot{width:.85em;height:.85em;border-radius:50%;flex:none;background:var(--c)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.seg button{border:2px solid var(--line);background:var(--panel-2);border-radius:10px;padding:.55em .4em;text-align:center;font-weight:700;line-height:1.2}
.seg button small{display:block;font-weight:400;color:var(--muted);font-size:.78em}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:rgba(244,185,66,.12)}
.powers-explain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6em}
.powers-explain div{background:var(--panel-2);border-radius:10px;padding:.7em;font-size:.88em}
.powers-explain b{display:flex;align-items:center;gap:.4em;font-family:var(--f-display);font-size:1.2em;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.2em}
details.howto{border-top:1px solid var(--line);padding-top:.8em}
details.howto summary{cursor:pointer;font-weight:700}
details.howto ol{margin:.6em 0 0;padding-left:1.3em;display:grid;gap:.35em}
.resume{display:flex;align-items:center;justify-content:space-between;gap:1em;flex-wrap:wrap;background:rgba(244,185,66,.1);border:1px solid var(--gold);border-radius:10px;padding:.7em 1em}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:.8em;flex-wrap:wrap}
.topbar .where{display:flex;align-items:baseline;gap:.8em;flex-wrap:wrap;min-width:0}
.topbar .where h2{font-size:clamp(26px,2.4vw,44px);text-transform:uppercase}
.tools{display:flex;gap:.4em;flex-wrap:wrap}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pips i{width:clamp(10px,1vw,16px);height:6px;border-radius:3px;background:var(--line)}
.pips i.done{background:var(--muted)}
.pips i.now{background:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:.35em;border-radius:999px;padding:.15em .7em;font-weight:700;font-size:.8em;text-transform:uppercase;letter-spacing:.08em;border:1px solid currentColor}
.pill.e{color:var(--ok)}.pill.m{color:var(--gold)}.pill.h{color:var(--ember)}

/* ---------- Question stage ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(16px,2.4vw,40px);align-items:start;flex:1}
.qcol{display:flex;flex-direction:column;gap:clamp(14px,1.6vw,26px);min-width:0}
.qtext{font-family:var(--f-body);font-weight:700;font-size:clamp(26px,2.9vw,58px);line-height:1.12;text-wrap:balance;margin:0}
.quote{font-family:var(--f-verse);font-style:italic;font-weight:500;font-size:clamp(28px,3.2vw,64px);line-height:1.15;margin:0;text-wrap:balance}
.quote::before{content:"\201C";color:var(--gold)}
.quote::after{content:"\201D";color:var(--gold)}
.verse{font-family:var(--f-verse);font-weight:500;font-size:clamp(26px,2.9vw,56px);line-height:1.25;margin:0;text-wrap:pretty}
.blank{display:inline-block;min-width:4.5em;border-bottom:.08em solid var(--gold);color:var(--gold);text-align:center;font-style:italic}
.blank.filled{animation:pop .5s ease}
.ref{font-family:var(--f-verse);font-style:italic;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1vw,16px)}
.opt{display:flex;align-items:center;gap:.8em;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:clamp(10px,1vw,18px);font-size:clamp(18px,1.6vw,32px);font-weight:600;min-width:0;transition:opacity .3s, border-color .3s, background .3s}
.opt .L{flex:none;width:1.8em;height:1.8em;border-radius:10px;display:grid;place-items:center;background:var(--gold);color:var(--gold-ink);font-family:var(--f-display);font-weight:900}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.revealed .opt{opacity:.35}
.revealed .opt.right{opacity:1;border-color:var(--ok);background:color-mix(in srgb, var(--ok) 18%, var(--panel))}
.revealed .opt.right .L{background:var(--ok)}
.answer{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4em 1em;background:color-mix(in srgb, var(--ok) 14%, var(--panel));border:2px solid var(--ok);border-radius:var(--r);padding:clamp(12px,1.2vw,20px);animation:pop .45s ease}
.answer .label{color:var(--ok)}
.answer strong{font-size:clamp(22px,2.2vw,44px);font-weight:800;line-height:1.15}
.seq{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;font-family:var(--f-display);font-weight:900;font-size:clamp(26px,2.6vw,52px)}
.seq b{background:var(--ok);color:var(--gold-ink);border-radius:8px;padding:0 .3em;min-width:1.3em;text-align:center}
.seq i{font-style:normal;color:var(--muted);font-size:.6em}
.ordered{margin:.4em 0 0;padding-left:1.4em;display:grid;gap:.2em;font-size:.95em}
.note{font-size:.9em;color:var(--muted);margin:0}

/* Timer */
.timer{position:relative;width:clamp(120px,12vw,220px);aspect-ratio:1;max-width:100%;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:9}
.timer .track{stroke:var(--line)}
.timer .bar{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .2s linear, stroke .3s}
.timer.low .bar{stroke:var(--ember)}
.timer.out .bar{stroke:var(--bad)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:clamp(44px,4.6vw,88px)}
.timer.low .t{color:var(--ember);animation:throb 1s infinite}
.timer.out .t{color:var(--bad);font-size:clamp(26px,2.4vw,44px)}
.timecol{display:flex;flex-direction:column;align-items:center;gap:.6em}

/* Host bar */
.hostbar{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.45em .5em .45em 1.1em}
.hostbar .hint{flex:1;min-width:12em;font-weight:600}
.hostbar .hint em{font-style:normal;color:var(--gold)}

/* Scoreboard strip */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,168px),1fr));gap:clamp(8px,.8vw,14px)}
.team{position:relative;background:var(--panel);border:2px solid var(--line);border-top:6px solid var(--c);border-radius:var(--r);padding:.6em .75em .7em;display:flex;flex-direction:column;gap:.25em;min-width:0;transition:border-color .2s, transform .15s, background .2s}
.team.markable{cursor:pointer}
.team.markable:hover{transform:translateY(-2px);border-color:var(--muted);border-top-color:var(--c)}
.team.m1{border-color:var(--ok);border-top-color:var(--c);background:color-mix(in srgb, var(--ok) 14%, var(--panel))}
.team.m2{border-color:var(--gold);border-top-color:var(--c);background:color-mix(in srgb, var(--gold) 16%, var(--panel))}
.team .tn{font-weight:700;font-size:.92em;line-height:1.2;overflow-wrap:anywhere;padding-right:2em}
.team .ts{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,2.1vw,42px);line-height:1}
.team .mk{position:absolute;top:.35em;right:.45em;font-family:var(--f-display);font-weight:900;font-size:1.4em;line-height:1}
.team.m1 .mk{color:var(--ok)}.team.m2 .mk{color:var(--gold)}
.team .meta{display:flex;align-items:center;gap:.4em;min-height:1.4em;flex-wrap:wrap}
.flame{display:inline-flex;align-items:center;gap:.15em;color:var(--ember);font-weight:800;font-size:.85em}
.flame svg{width:1em;height:1em}
.delta{font-family:var(--f-display);font-weight:900;font-size:1.05em;animation:rise .7s ease}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}.delta.zero{color:var(--muted)}
.tag{font-size:.68em;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:.05em .35em;background:var(--panel-2);color:var(--muted)}
.tag.hot{background:var(--ember);color:#1d0800}
.tag.x2{background:var(--gold);color:var(--gold-ink)}
.pw{display:flex;gap:.3em;margin-top:.15em;flex-wrap:wrap}
.pw button,.pw .sh{font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;border:1.5px solid var(--line);background:var(--panel-2);padding:.25em .5em;display:inline-flex;align-items:center;gap:.25em}
.pw button:hover:not([disabled]){border-color:var(--gold)}
.pw button[disabled]{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.pw button.armed{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);animation:throb 1.2s infinite}
.pw .sh{color:var(--muted)}
.pw .sh.on{color:#9fd8ff;border-color:#5c8fd1}
.pw .sh.off{opacity:.3;text-decoration:line-through}
.pw svg,.powers-explain svg,.pick svg{width:1em;height:1em;flex:none}
.wagerline{font-size:.8em;color:var(--muted)}
.wagerline b{color:var(--gold)}

/* ---------- Intro splash ---------- */
.splash{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2vw,28px);padding-block:clamp(10px,4vw,60px);max-width:60em}
.splash .rn{font-family:var(--f-display);font-weight:900;color:var(--gold);font-size:clamp(22px,2vw,36px);text-transform:uppercase;letter-spacing:.12em}
.splash h1{font-size:clamp(64px,9vw,170px);text-transform:uppercase;line-height:.85;animation:slam .6s cubic-bezier(.2,1.4,.4,1)}
.splash .rules{margin:0;padding-left:1.2em;display:grid;gap:.4em;font-size:1.15em;max-width:42em}
.splash .stats{display:flex;gap:clamp(16px,3vw,48px);flex-wrap:wrap}
.splash .stats div{display:flex;flex-direction:column}
.splash .stats b{font-family:var(--f-display);font-weight:900;font-size:clamp(32px,3.4vw,64px);line-height:1}
.splash .stats span{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.8em;font-weight:700}

/* ---------- Leaderboard ---------- */
.board{display:flex;flex-direction:column;gap:clamp(6px,.7vw,12px)}
.row{display:grid;grid-template-columns:2.4em minmax(0,14em) minmax(0,1fr) 5.5em 4.5em;gap:.8em;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.45em .9em;animation:slidein .5s both}
.row .rk{font-family:var(--f-display);font-weight:900;font-size:1.8em;color:var(--muted);line-height:1}
.board:not(.rest) .row:first-child{border-color:var(--gold)}
.board:not(.rest) .row:first-child .rk{color:var(--gold)}
.row .nm{font-weight:700;display:flex;align-items:center;gap:.5em;min-width:0;overflow-wrap:anywhere}
.row .barwrap{height:clamp(14px,1.4vw,26px);background:var(--panel-2);border-radius:999px;overflow:hidden}
.row .barfill{height:100%;background:var(--c);border-radius:999px;width:var(--from);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.row .sc{font-family:var(--f-display);font-weight:900;font-size:1.7em;text-align:right;line-height:1}
.row .mv{font-weight:800;font-size:.85em;text-align:right;white-space:nowrap}
.mv.up{color:var(--ok)}.mv.down{color:var(--bad)}.mv.same{color:var(--muted)}

/* ---------- Wager ---------- */
.wagers{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:.7em}
.wagers label{display:flex;flex-direction:column;gap:.35em;background:var(--panel);border:2px solid var(--line);border-top:6px solid var(--c);border-radius:var(--r);padding:.7em .8em}
.wagers label span{font-weight:700;overflow-wrap:anywhere}
.wagers label small{color:var(--muted)}
.wagers input{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:.5em .6em;font-family:var(--f-display);font-weight:900;font-size:1.6em;width:100%;min-width:0}
.wagers input:focus{border-color:var(--gold);outline:none}

/* ---------- End ---------- */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.4vw,22px);align-items:end;max-width:1100px;width:100%;margin:0 auto}
.pod{display:flex;flex-direction:column;align-items:center;gap:.5em;text-align:center;min-width:0}
.pod .who{font-weight:800;font-size:clamp(16px,1.5vw,28px);overflow-wrap:anywhere}
.pod .block{width:100%;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(var(--c), color-mix(in srgb, var(--c) 35%, var(--night)));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:.6em;animation:grow 1s cubic-bezier(.2,.9,.3,1) both}
.pod .place{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,5vw,96px);line-height:1;color:var(--night)}
.pod .pts{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,2vw,40px);color:var(--night)}
.p1 .block{height:clamp(160px,22vw,340px);animation-delay:.9s}
.p2 .block{height:clamp(120px,16vw,250px);animation-delay:.5s}
.p3 .block{height:clamp(90px,11vw,180px);animation-delay:.2s}
.champ{text-align:center;display:flex;flex-direction:column;gap:.4em;align-items:center}
.champ h1{font-size:clamp(48px,7vw,130px);text-transform:uppercase;color:var(--gold);animation:slam .7s 1.4s cubic-bezier(.2,1.4,.4,1) both}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
.center{display:flex;justify-content:center;gap:.6em;flex-wrap:wrap}

/* ---------- Modal + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,8,25,.72);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2vw,28px);width:min(720px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:1em}
.modal h3{font-size:2em;text-transform:uppercase}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:.5em}
.pick button{display:flex;align-items:center;justify-content:space-between;gap:.5em;text-align:left;background:var(--panel-2);border:2px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:.6em .8em;font-weight:700}
.pick button:hover{border-color:var(--gold);border-left-color:var(--c)}
.pick small{font-weight:600;color:var(--muted);display:flex;align-items:center;gap:.3em;white-space:nowrap}
.adj{display:grid;gap:.4em}
.adj div{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:.5em;align-items:center}
.adj input{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:.4em .6em;min-width:0;width:100%}
.adj .num{font-family:var(--f-display);font-weight:900;font-size:1.4em;min-width:3em;text-align:right}
.modal .foot{display:flex;justify-content:flex-end;gap:.5em;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--gold-ink);font-weight:800;padding:.7em 1.3em;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:30;max-width:calc(100% - 32px);text-align:center;font-size:1.1em}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Number(n).toLocaleString("en-US");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function recall(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}

function mcQ(q, opts, ref){
  const ord = shuffle([0,1,2,3]);
  return {type:"mc", q, options:ord.map(i=>opts[i]), correct:ord.indexOf(0), ref};
}
function orderQ(prompt, items, ref){
  let ord; do { ord = shuffle([0,1,2,3]); } while (ord.every((v,i)=>v===i));
  return {type:"order", q:prompt, options:ord.map(i=>items[i]), seq:[0,1,2,3].map(i=>LET[ord.indexOf(i)]), items, ref};
}
let used = new Set(recall("bs-used") || []);
function pick(pool, n, keyFn){
  let fresh = pool.filter(x=>!used.has(keyFn(x)));
  if (fresh.length < n) { pool.forEach(x=>used.delete(keyFn(x))); fresh = pool.slice(); }
  const out = shuffle(fresh).slice(0,n);
  out.forEach(x=>used.add(keyFn(x)));
  store("bs-used",[...used]);
  return out;
}

  const who = pick(BANK.who, n.who, x=>x[0]).map(r=>({...mcQ(r[0],r[1],r[2]), quote:true, pts:150}));
  const order = pick(BANK.order, n.order, x=>x[0]+x[1][0]).map(r=>({...orderQ(r[0],r[1],r[2]), pts:200}));
  const nb = Math.round(n.verse/3);
  const verse = shuffle([
    ...pick(BANK.verse, n.verse-nb, x=>x[0]).map(r=>({type:"verse", q:r[0], answer:r[1], ref:r[2], note:r[3]||"", pts:200})),
    ...pick(BANK.book, nb, x=>x[0]).map(r=>({...mcQ(r[0],r[1],r[2]), pts:200}))
  ]);
  const f = pick(BANK.final, 1, x=>x[1])[0];
  const final = [{type:"open", category:f[0], q:f[1], answer:f[2], ref:f[3], pts:0}];
  const qs = {rapid, who, order, verse, final};
  return ROUNDS.map((def,i)=>({idx:i, qs:qs[def.id]}));
}

/* =====================================================================
   STATE
   ===================================================================== */
function blankSetup(){
  return {screen:"setup", setup:{count:7, names:NAMES.slice(), len:"standard"}, muted:false};
}
let S = blankSetup();
let hist = [];
const SNAP_KEYS = ["teams","screen","ri","qi","phase","marks","armed","wagers","lastDeltas","timer","roundStart"];
function pushHist(){ hist.push(JSON.stringify(SNAP_KEYS.reduce((o,k)=>(o[k]=S[k],o),{}))); if(hist.length>60) hist.shift(); }
function undo(){
  if(!hist.length){ toast("Nothing to undo"); return; }
  const snap = JSON.parse(hist.pop()); Object.assign(S, snap);
  if(S.timer) S.timer.running=false; clearInterval(tick);
  save(); render(); toast("Undone");
}
function save(){ const {modal, ...rest} = S; store("bs-state", rest); }
function round(){ return S.rounds[S.ri]; }
function rdef(){ const r = round(); return r.customDef || ROUNDS[r.idx]; }
function curQ(){ return round().qs[S.qi]; }

function startGame(again){
  const names = S.setup.names.slice(0, S.setup.count).map((n,i)=>(n||"").trim()||`Team ${i+1}`);
  S.teams = again ? S.teams.map(t=>freshTeam(t.name,t.color)) : names.map((n,i)=>freshTeam(n, COLORS[i%COLORS.length]));
  S.rounds = buildRounds(S.setup.len);
  S.ri = 0; S.qi = 0; S.screen = "intro"; S.wagers = []; S.lastDeltas=null;
  S.roundStart = S.teams.map(t=>t.score);
  hist = []; save(); render();
}
function freshTeam(name,color){ return {name, color, score:0, streak:0, powers:{double:true, steal:true, shield:true}}; }

function beginRound(){
  if (rdef().wager){ S.screen="wager"; S.wagers = S.teams.map(()=>0); save(); render(); return; }
  S.screen = "q"; S.qi = 0; startQ();
}
function startQ(){
  const t = rdef().time;
  S.phase = "ask"; S.marks = {}; S.armed = {}; S.lastDeltas = null;
  S.timer = {left:t, total:t, running:false};
  clearInterval(tick); save(); render(); tone(520,.12,"triangle",.08);
}
function reveal(){
  if (S.phase!=="ask") return;
  pushHist(); pauseTimer(); S.phase = "reveal"; save(); render();
  tone(660,.14,"sine",.14); tone(990,.3,"sine",.14,.12);
}
function cycleMark(i){
  if (S.phase!=="reveal") return;
  const max = rdef().special ? 2 : 1;
  S.marks[i] = ((S.marks[i]||0)+1) % (max+1);
  save(); renderTeams(); updateHost();
}
function award(){
  if (S.phase!=="reveal") return;
  pushHist(); pauseTimer();
  const d0 = rdef(), q = curQ(); S.lastDeltas = {};
  let anyHot = false;
  S.teams.forEach((t,i)=>{
    const m = S.marks[i]||0; let d = 0; const notes = [];
    if (d0.wager){
      const w = S.wagers[i]||0; d = m ? w : -w;
    } else if (m){
      d = q.pts;
      if (m===2 && d0.special==="first"){ d += FIRST_BONUS; notes.push("fast"); }
      if (m===2 && d0.special==="half"){ d = Math.round(q.pts/2); notes.push("half"); }
      if (S.armed[i]){ d *= 2; notes.push("×2"); }
      t.streak++;
      if (t.streak % 3 === 0){ d += STREAK_BONUS; notes.push("hot"); anyHot = true; }
    } else {
      if (S.armed[i]) notes.push("×2 lost");
      t.streak = 0;
    }
    if (S.armed[i]) t.powers.double = false;
    t.score += d;
    S.lastDeltas[i] = {d, notes};
  });
  S.armed = {}; S.phase = "awarded"; save(); render();
  tone(523,.12,"triangle",.12); tone(784,.2,"triangle",.12,.1);
  if (anyHot){ tone(1046,.25,"square",.06,.25); toast("Hot streak! +100 for three in a row"); }
}
function nextQ(){
  if (S.phase==="ask" || S.phase==="reveal"){
    // skipping without awarding
    pushHist();
  }
  const r = round();
  if (S.qi < r.qs.length-1){ S.qi++; startQ(); return; }
  pauseTimer(); S.lastDeltas=null;
  if (S.ri >= S.rounds.length-1 || rdef().wager || rdef().tie){ S.screen = "end"; save(); render(); fanfare(); return; }
  S.screen = "board"; save(); render();
}
function nextRound(){
  S.ri++; S.qi = 0; S.roundStart = S.teams.map(t=>t.score); S.screen = "intro"; save(); render();
}
function lockWagers(){
  S.wagers = S.teams.map((t,i)=>Math.max(0, Math.min(Math.max(t.score,0), Math.floor(+S.wagers[i]||0))));
  S.screen = "q"; S.qi = 0; S.armed = {}; startQ();
}
function tiebreak(){
  const hard = BANK.rapid.filter(r=>r[0]==="h");
  const r = pick(hard, 1, x=>x[1])[0];
  S.rounds.push({customDef:{id:"tie", name:"Sudden Death", time:20, pts:200, tie:true, ptsLabel:"200",
    rules:["Only the tied teams play.","One hard question. Write A, B, C or D.","First correct answer takes the crown. Still tied? Run it again."]},
    qs:[{...mcQ(r[1],r[2],r[3]), diff:"h", pts:200}]});
  S.ri = S.rounds.length-1; S.qi=0; S.roundStart = S.teams.map(t=>t.score); S.screen="intro"; save(); render();
}
function toggleDouble(i){
  const t = S.teams[i]; if(!t.powers.double || S.phase==="awarded" || rdef().wager) return;
  S.armed[i] = !S.armed[i]; save(); renderTeams();
  if (S.armed[i]){ tone(880,.1,"square",.05); toast(`${t.name} armed Double Points`); }
}
function doSteal(from,to){
  pushHist();
  const a = S.teams[from], b = S.teams[to]; a.powers.steal = false;
  if (b.powers.shield){
    b.powers.shield = false; toast(`Blocked! ${b.name}'s Shield stopped the steal`); tone(300,.3,"square",.08);
  } else {
    const amt = Math.max(0, Math.min(STEAL_AMT, b.score)); b.score -= amt; a.score += amt;
    toast(`${a.name} stole ${amt} from ${b.name}`); tone(700,.1,"sawtooth",.07); tone(400,.25,"sawtooth",.07,.1);
  }
  S.modal = null; save(); render();
}

/* =====================================================================
   TIMER + SOUND
   ===================================================================== */
let tick = null;
function startTimer(){
  if (!S.timer || S.timer.left<=0 || S.phase!=="ask") return;
  ac();
  S.timer.running = true; S.timer.end = Date.now() + S.timer.left*1000;
  clearInterval(tick); tick = setInterval(step, 150); updTimer();
}
function pauseTimer(){
  if (!S.timer || !S.timer.running) return;
  S.timer.left = Math.max(0,(S.timer.end-Date.now())/1000); S.timer.running=false; clearInterval(tick); updTimer();
}
function toggleTimer(){ S.timer && S.timer.running ? pauseTimer() : startTimer(); updateHost(); }
function addTime(s){ if(!S.timer) return; if(S.timer.running) S.timer.end += s*1000; S.timer.left += s; S.timer.total = Math.max(S.timer.total, S.timer.left); updTimer(); updateHost(); }
function step(){
  const prev = Math.ceil(S.timer.left);
  const left = Math.max(0,(S.timer.end-Date.now())/1000); S.timer.left = left;
  const sec = Math.ceil(left);
  if (sec!==prev && sec<=5 && sec>0) tone(sec===1?1100:880,.09,"square",.06);
  if (left<=0){ S.timer.running=false; clearInterval(tick); tone(150,.7,"sawtooth",.13); updateHost(); }
  updTimer();
}
function updTimer(){
  const el = $(".timer"); if(!el || !S.timer) return;
  const {left,total} = S.timer, C = 2*Math.PI*54;
  el.querySelector(".bar").style.strokeDashoffset = C*(1-left/total);
  el.querySelector(".t").textContent = left<=0 ? "TIME" : Math.ceil(left);
  el.classList.toggle("low", left>0 && left<=5);
  el.classList.toggle("out", left<=0);
  const b = $("#tbtn"); if(b) b.innerHTML = S.timer.running ? 'Pause <kbd>Space</kbd>' : (left<=0?'Time is up':(left<total?'Resume <kbd>Space</kbd>':'Start timer <kbd>Space</kbd>'));
  if (b) b.disabled = left<=0 || S.phase!=="ask";
}
let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx && actx.state==="suspended") actx.resume(); return actx; }
function tone(f,d,type="sine",vol=.12,when=0){
  if (S.muted) return; const c = actx; if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain(), t0=c.currentTime+when;
    o.type=type; o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+d+.05);
  }catch(e){}
}
function fanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f,.35,"triangle",.12,i*.16)); tone(1046,.9,"triangle",.12,.7); }

let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }

function render(){
  const app = $("#app");
  const v = {setup:vSetup, intro:vIntro, q:vQuestion, board:vBoard, wager:vWager, end:vEnd}[S.screen] || vSetup;
  app.innerHTML = v() + vModal();
  if (S.screen==="q") updTimer();
  if (S.screen==="board") requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".barfill").forEach(b=>b.style.width=b.dataset.to)));
  if (S.screen==="end") confetti(); else stopConfetti();
  const f = app.querySelector("[data-autofocus]"); if (f) f.focus();
}

function vQuestion(){
  const d = rdef(), r = round(), q = curQ();
  const revealed = S.phase!=="ask";
  const pips = r.qs.map((_,i)=>`<i class="${i<S.qi?"done":i===S.qi?"now":""}"></i>`).join("");
  const C = 2*Math.PI*54;
  let body = "";
  if (q.type==="mc"){
    body = `${q.quote?`<p class="quote">${esc(q.q)}</p>`:`<p class="qtext">${esc(q.q)}</p>`}
      <div class="opts ${revealed?"revealed":""}">${q.options.map((o,i)=>`<div class="opt ${i===q.correct?"right":""}"><span class="L">${LET[i]}</span><span>${esc(o)}</span></div>`).join("")}</div>
      ${revealed?`<div class="answer"><span class="label">Answer</span><strong>${LET[q.correct]}. ${esc(q.options[q.correct])}</strong><span class="ref">${esc(q.ref)}</span></div>`:""}`;
  } else if (q.type==="order"){
    body = `<p class="qtext">${esc(q.q)}</p>
      <div class="opts">${q.options.map((o,i)=>`<div class="opt"><span class="L">${LET[i]}</span><span>${esc(o)}</span></div>`).join("")}</div>
      ${revealed?`<div class="answer"><span class="label">Correct order</span><div class="seq">${q.seq.map((l,i)=>`${i?"<i>→</i>":""}<b>${l}</b>`).join("")}</div><span class="ref">${esc(q.ref)}</span>
        <ol class="ordered" style="flex-basis:100%">${q.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`:""}`;
  } else if (q.type==="verse"){
    const parts = esc(q.q).split("___");
    const blank = revealed ? `<span class="blank filled">${esc(q.answer)}</span>` : `<span class="blank">&nbsp;</span>`;
    body = `<span class="eyebrow">Finish the verse</span>
      <p class="verse">${parts[0]}${blank}${parts[1]||""}</p>
      ${revealed?`<div class="answer"><span class="label">Answer</span><strong>${esc(q.answer)}</strong><span class="ref">${esc(q.ref)}</span></div>${q.note?`<p class="note">${esc(q.note)}</p>`:""}`:`<p class="ref">${esc(q.ref)}</p>`}`;
  } else {
    body = `<span class="eyebrow">Category: ${esc(q.category)}</span>
      <p class="qtext">${esc(q.q)}</p>
      ${revealed?`<div class="answer"><span class="label">Answer</span><strong>${esc(q.answer)}</strong><span class="ref">${esc(q.ref)}</span></div>`:""}`;
  }
  const meta = d.wager ? `<span class="pill m">Wager</span>` :
    q.diff ? `<span class="pill ${q.diff}">${DIFFNAME[q.diff]} · ${q.pts}</span>` : `<span class="pill m">${q.pts} pts</span>`;
  return `<div class="topbar">
      <div class="where"><span class="eyebrow">${d.tie?"Tiebreaker":`Round ${S.ri+1}`}</span><h2>${d.name}</h2>
        <span class="muted num">Q ${S.qi+1}/${r.qs.length}</span><div class="pips" aria-hidden="true">${pips}</div>${meta}</div>
      ${toolsHTML()}
    </div>
    <section class="stage">
      <div class="qcol">${body}</div>

        <div class="timer" role="timer" aria-label="Time left">
          <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/><circle class="bar" cx="60" cy="60" r="54" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>

      </div>
    </section>
    <div class="hostbar" id="hostbar">${hostInner()}</div>
    ${teamsHTML()}`;
}

      <div class="meta">${delta}${flame}</div>
      ${wl}${pw}
    </div>`;}).join("")}</section>`;
}
function renderTeams(){ const el=$("#teams"); if(el) el.outerHTML = teamsHTML(); }

function ranked(scores){
  return S.teams.map((t,i)=>({...t,i,score:scores?scores[i]:t.score})).sort((a,b)=>b.score-a.score);
}
function vBoard(){
  const before = ranked(S.roundStart), now = ranked();
  const max = Math.max(1, ...S.teams.map(t=>t.score), ...S.roundStart);
  const prevRank = {}; before.forEach((t,k)=>prevRank[t.i]=k);
  const nextDef = ROUNDS[S.ri+1];
  return `<div class="topbar"><div class="where"><span class="eyebrow">Standings</span><h2>After round ${S.ri+1}</h2></div>${toolsHTML()}</div>
  <section class="board">${now.map((t,k)=>{
    const mv = prevRank[t.i]-k, gain = t.score - S.roundStart[t.i];
    return `<div class="row" style="--c:${t.color};animation-delay:${k*.07}s">
      <span class="rk num">${k+1}</span>
      <span class="nm"><span class="dot"></span>${esc(t.name)}</span>
      <div class="barwrap"><div class="barfill" style="--from:${Math.max(0,S.roundStart[t.i])/max*100}%" data-to="${Math.max(0,t.score)/max*100}%"></div></div>
      <span class="sc num">${fmt(t.score)}</span>
      <span class="mv ${mv>0?"up":mv<0?"down":"same"} num">${mv>0?`▲ ${mv}`:mv<0?`▼ ${-mv}`:"–"} <span class="muted">${gain>=0?"+":""}${fmt(gain)}</span></span>
    </div>`;}).join("")}</section>
  <div class="center"><button class="btn primary big" data-act="nextround" data-autofocus>Next: ${nextDef?nextDef.name:"Final"} <kbd>N</kbd></button></div>`;
}

function vWager(){
  const q = round().qs[0];
  return `<div class="topbar"><div class="where"><span class="eyebrow">Round ${S.ri+1}</span><h2>Final Wager</h2></div>${toolsHTML()}</div>
  <section class="splash" style="max-width:none;padding-block:0">
    <div class="rn">The category is</div>
    <h1 style="font-size:clamp(48px,7vw,130px)">${esc(q.category)}</h1>
    <p class="muted" style="margin:0">Each team writes a secret wager, from 0 up to its score. Collect them and type them in below.</p>
  </section>
  <section class="wagers">${S.teams.map((t,i)=>`<label style="--c:${t.color}"><span>${esc(t.name)}</span><small class="num">Score ${fmt(t.score)} · max wager ${fmt(Math.max(0,t.score))}</small>
    <input type="number" inputmode="numeric" id="wg${i}" data-wager="${i}" min="0" max="${Math.max(0,t.score)}" step="50" value="${S.wagers[i]||0}"></label>`).join("")}</section>
  <div class="center"><button class="btn primary big" data-act="lockwagers">Lock wagers and show the question</button></div>`;
}

function vEnd(){
  const r = ranked(), top = r[0], tied = r.length>1 && r[1].score===top.score;
  const pod = [r[1],r[0],r[2]].map((t,k)=>t?`<div class="pod p${[2,1,3][k]}" style="--c:${t.color}"><div class="who">${esc(t.name)}</div><div class="block"><div class="place">${[2,1,3][k]}</div><div class="pts num">${fmt(t.score)}</div></div></div>`:`<div></div>`).join("");
  return `<div class="topbar"><div class="where"><span class="eyebrow">Final results</span></div>${toolsHTML()}</div>
  <section class="champ">
    <span class="eyebrow">${tied?"It's a tie at the top":"Champions"}</span>
    <h1>${tied?"Sudden death!":esc(top.name)}</h1>
  </section>
  <section class="podium">${pod}</section>
  <section class="board rest">${r.slice(3).map((t,k)=>`<div class="row" style="--c:${t.color}"><span class="rk num">${k+4}</span><span class="nm"><span class="dot"></span>${esc(t.name)}</span><div class="barwrap"><div class="barfill" style="width:${Math.max(0,t.score)/Math.max(1,top.score)*100}%"></div></div><span class="sc num">${fmt(t.score)}</span><span></span></div>`).join("")}</section>
  <div class="center">
    ${tied?`<button class="btn primary big" data-act="tiebreak">Play a sudden-death question</button>`:""}
    <button class="btn ${tied?"":"primary"} big" data-act="again">Rematch with new questions</button>
    <button class="btn big ghost" data-act="newgame">New game setup</button>
  </div>`;
}

function vModal(){
  if (!S.modal) return "";
  if (S.modal.kind==="steal"){
    const a = S.teams[S.modal.from];
    return `<div class="scrim" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-label="Choose a team to steal from">
      <span class="eyebrow">Steal ${STEAL_AMT} points</span><h3>Who does ${esc(a.name)} steal from?</h3>
      <div class="pick">${S.teams.map((t,i)=>i===S.modal.from?"":`<button data-act="stealto" data-i="${i}" style="--c:${t.color}"><span>${esc(t.name)}</span><small class="num">${fmt(t.score)}${t.powers.shield?` ${ICON.shield}`:""}</small></button>`).join("")}</div>
      <p class="note">Teams showing a shield icon will block the steal, and their Shield is used up.</p>
      <div class="foot"><button class="btn" data-act="close">Cancel</button></div></div></div>`;
  }
  if (S.modal.kind==="scores"){
    return `<div class="scrim" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-label="Edit scores and teams">
      <span class="eyebrow">Leader controls</span><h3>Scores &amp; teams</h3>
      <div class="adj">${S.teams.map((t,i)=>`<div><span class="dot" style="--c:${t.color}"></span><input id="ed${i}" data-rename="${i}" value="${esc(t.name)}" aria-label="Team ${i+1} name" maxlength="28">
        <button class="btn sm" data-act="adj" data-i="${i}" data-d="-50" aria-label="Subtract 50 from ${esc(t.name)}">−50</button>
        <span class="num">${fmt(t.score)}</span>
        <button class="btn sm" data-act="adj" data-i="${i}" data-d="50" aria-label="Add 50 to ${esc(t.name)}">+50</button></div>`).join("")}</div>
      <div class="foot"><button class="btn ghost" data-act="quit">End game and go to setup</button><button class="btn primary" data-act="close">Done</button></div></div></div>`;
  }
  if (S.modal.kind==="quit"){
    return `<div class="scrim" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-label="End game">
      <h3>End this game?</h3><p>The scores will be cleared. This can't be undone.</p>
      <div class="foot"><button class="btn" data-act="close">Keep playing</button><button class="btn primary" data-act="quityes">End game</button></div></div></div>`;
  }
  return "";
}

/* =====================================================================
   CONFETTI
   ===================================================================== */
let confRAF = null;
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"), cx = cv.getContext("2d"); cv.hidden = false;
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = S.teams ? [ranked()[0].color, "#f4b942", "#f5f0e2"] : COLORS;
  const P = Array.from({length:180},()=>({x:Math.random()*W, y:-20-Math.random()*H, r:4+Math.random()*6, c:cols[Math.floor(Math.random()*cols.length)], vy:2+Math.random()*3, vx:-1+Math.random()*2, a:Math.random()*6, va:-.1+Math.random()*.2}));
  const t0 = performance.now();
  cancelAnimationFrame(confRAF);
  (function f(t){
    cx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.y+=p.vy; p.x+=p.vx+Math.sin(p.a)*.6; p.a+=p.va; if(p.y>H+20 && t-t0<6000){p.y=-20;p.x=Math.random()*W;}
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); });
    if (t-t0 < 10000) confRAF = requestAnimationFrame(f); else stopConfetti();
  })(t0);
}
function stopConfetti(){ cancelAnimationFrame(confRAF); const cv=$("#confetti"); if(cv){ cv.hidden=true; } }

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, i = +el.dataset.i;
  if (act==="close" && el.classList.contains("scrim") && e.target!==el) return;
  ac();
  switch(act){
    case "count": S.setup.count = Math.max(2, Math.min(10, S.setup.count + +el.dataset.d)); render(); break;
    case "len": S.setup.len = el.dataset.k; render(); break;
    case "start": startGame(false); break;
    case "resume": { const sv = recall("bs-state"); if (sv){ S = {...blankSetup(), ...sv}; if(S.timer) S.timer.running=false; hist=[]; render(); } break; }
    case "begin": beginRound(); break;
    case "timer": toggleTimer(); break;
    case "add10": addTime(10); break;
    case "reveal": reveal(); break;
    case "mark": cycleMark(i); break;
    case "award": award(); break;
    case "next": nextQ(); break;
    case "nextround": nextRound(); break;
    case "double": toggleDouble(i); break;
    case "steal": if (S.teams[i].powers.steal){ S.modal = {kind:"steal", from:i}; render(); } break;
    case "stealto": doSteal(S.modal.from, i); break;
    case "scores": S.modal = {kind:"scores"}; render(); break;
    case "adj": pushHist(); S.teams[i].score += +el.dataset.d; save(); render(); break;
    case "quit": S.modal = {kind:"quit"}; render(); break;
    case "quityes": { const keep = S.setup; S = blankSetup(); S.setup = keep; store("bs-state", null); hist=[]; clearInterval(tick); render(); break; }
    case "close": S.modal = null; render(); break;
    case "undo": undo(); break;
    case "mute": S.muted = !S.muted; save(); render(); break;
    case "lockwagers": lockWagers(); break;
    case "tiebreak": tiebreak(); break;
    case "again": startGame(true); break;
    case "newgame": { const keep = S.setup; keep.names = S.teams ? S.teams.map(t=>t.name).concat(NAMES.slice(S.teams.length)) : keep.names; S = blankSetup(); S.setup = keep; store("bs-state", null); render(); break; }
  }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if (t.dataset.name!==undefined){ S.setup.names[+t.dataset.name] = t.value; }
  if (t.dataset.wager!==undefined){ S.wagers[+t.dataset.wager] = t.value; save(); }
  if (t.dataset.rename!==undefined){ S.teams[+t.dataset.rename].name = t.value; save(); }
});
document.addEventListener("change", e=>{ if (e.target.dataset.rename!==undefined) { renderTeams(); } });
document.addEventListener("keydown", e=>{
  if (e.target.matches("input,textarea,select")) { if(e.key==="Escape") e.target.blur(); return; }
  if (S.modal){ if (e.key==="Escape"){ S.modal=null; render(); } return; }
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key.toLowerCase();
  if ((k==="enter"||k===" ") && e.target.dataset && e.target.dataset.act==="mark"){ e.preventDefault(); cycleMark(+e.target.dataset.i); return; }
  if (S.screen==="q"){
    if (k===" "){ e.preventDefault(); ac(); toggleTimer(); }
    else if (k==="r") reveal();
    else if (k==="a") award();
    else if (k==="n" && S.phase==="awarded") nextQ();
    else if (/^[0-9]$/.test(k)){ const i = k==="0"?9:+k-1; if (i<S.teams.length) cycleMark(i); }
    else if (k==="u") undo();
  } else if (S.screen==="intro" && k==="n") beginRound();
  else if (S.screen==="board" && k==="n") nextRound();
  else if (k==="u" && S.screen!=="setup") undo();
});
addEventListener("resize", ()=>{ if(S.screen==="end"){ const cv=$("#confetti"); if(cv && !cv.hidden){ cv.width=innerWidth; cv.height=innerHeight; } } });

/* =====================================================================
   BOOT
   ===================================================================== */
function boot(data){
  if (data && data.S){ S = data.S; if (S.timer) S.timer.running = false; }
  render();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
