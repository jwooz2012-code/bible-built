<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6953bfa67629f34f674461da/6d21a8071_AppIcon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />

    <title>Bible Built — Track What Matters</title>
    <meta name="description" content="Bible Built helps you read and track your way through Scripture. Log chapters, build streaks, and celebrate milestones." />

    <!-- Open Graph (iMessage, Slack, WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bible Built — Track What Matters" />
    <meta property="og:description" content="Bible Built helps you read and track your way through Scripture. Log chapters, build streaks, and celebrate milestones." />
    <meta property="og:image" content="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6953bfa67629f34f674461da/6d21a8071_AppIcon.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bible Built — Track What Matters" />
    <meta name="twitter:description" content="Bible Built helps you read and track your way through Scripture. Log chapters, build streaks, and celebrate milestones." />
    <meta name="twitter:image" content="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6953bfa67629f34f674461da/6d21a8071_AppIcon.png" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bible Built" />
    <link rel="apple-touch-icon" href="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6953bfa67629f34f674461da/6d21a8071_AppIcon.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- OneSignal queue: the app pushes its OneSignal calls here; the SDK
         (loaded at the end of <body>) runs them once it arrives. -->
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "44cb7eb8-7aca-44c1-b180-40e871493808",
          serviceWorkerPath: "/OneSignalSDKWorker.js",
          // Do NOT auto-prompt — we control when the prompt appears
          promptOptions: { autoPrompt: false },
        });
      });
    </script>

    <!-- Startup screen shown until the app draws its first screen. -->
    <style>
      #bb-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #ffffff; color: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #bb-boot.bb-dark { background: #0a0a0a; color: #fafafa; }
      #bb-boot img { width: 72px; height: 72px; border-radius: 18px; }
      #bb-boot .bb-spin { width: 28px; height: 28px; border: 3px solid rgba(127, 127, 127, 0.25); border-top-color: currentColor; border-radius: 50%; animation: bb-spin 0.8s linear infinite; }
      #bb-boot .bb-retry { display: none; flex-direction: column; align-items: center; gap: 12px; font-size: 15px; text-align: center; padding: 0 24px; }
      #bb-boot.bb-slow .bb-retry { display: flex; }
      #bb-boot button { font: inherit; font-weight: 600; padding: 12px 28px; border-radius: 12px; border: 0; background: currentColor; }
      #bb-boot button span { color: #ffffff; }
      #bb-boot.bb-dark button span { color: #0a0a0a; }
      @keyframes bb-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="bb-boot" role="status" aria-label="Loading Bible Built">
        <img src="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6953bfa67629f34f674461da/6d21a8071_AppIcon.png" alt="" onerror="this.style.visibility='hidden'" />
        <div class="bb-spin"></div>
        <div class="bb-retry">
          <div>Taking longer than usual.</div>
          <button type="button" onclick="location.reload()"><span>Tap to retry</span></button>
        </div>
      </div>
    </div>
    <script>
      // Match the saved theme, and offer a retry if the app hasn't started
      // after 10s or its code failed to download. React replaces #bb-boot
      // as soon as it draws, so none of this shows on a normal start.
      (function () {
        var boot = document.getElementById('bb-boot');
        try {
          var theme = localStorage.getItem('theme') || 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) boot.className = 'bb-dark';
        } catch (e) {}
        function slow() {
          var b = document.getElementById('bb-boot');
          if (b) b.classList.add('bb-slow');
        }
        setTimeout(slow, 10000);
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (el && el.tagName === 'SCRIPT' && el.src && el.src.indexOf(location.origin) === 0) slow();
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>

    <!-- OneSignal Web SDK — handles push for web/PWA contexts.
         AppMyWeb's native wrapper overrides window.OneSignal automatically on iOS.
         Kept last so the app starts without waiting for it: a slow or stalled
         download here used to leave a white screen. It still loads before the
         page finishes (deferred), so the native wrapper sees the same order. -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  </body>
</html>
